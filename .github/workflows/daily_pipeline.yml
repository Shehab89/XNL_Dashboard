name: Political Media Monitor — collect & analyse

on:
  schedule:
    - cron: "17 */2 * * *"      # every 2 hours (UTC); feeds without paging (RSS, Telegram) miss less
  workflow_dispatch:
    inputs:
      hours:
        description: "Look back this many hours (default: 48 from config/sources.yaml)"
        required: false
        default: ""
      backfill_days:
        description: "One-off: collect this many past days (e.g. 365) instead of the regular run"
        required: false
        default: ""
      backfill_until:
        description: "Resume an interrupted backfill from this date (YYYY-MM-DD)"
        required: false
        default: ""

concurrency:
  group: media-monitor
  cancel-in-progress: false

permissions:
  contents: read

env:
  SENTIMENT_MODEL: cardiffnlp/twitter-xlm-roberta-base-sentiment

jobs:
  pipeline:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 in Oct 2026
    timeout-minutes: ${{ github.event.inputs.backfill_days != '' && 340 || 60 }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}             # LLM sentiment + topic classification (preferred)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}       # alternative LLM provider
      LLM_MODEL: ${{ vars.LLM_MODEL }}                          # optional model override
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}   # backup if the local model cannot load
      BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}           # optional: Reddit API (anonymous Reddit is blocked from GitHub)
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}           # optional: YouTube comments (Data API v3)
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_CT0 }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies (CPU-only torch keeps it small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-model.txt

      - name: Cache the sentiment model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.SENTIMENT_MODEL }}

      # ---- optional: X search with a logged-in browser (X_AUTH_TOKEN / X_CT0 secrets). It runs a real browser window
      # on a virtual screen (xvfb), because headless Chromium gets stuck on X's "Even geduld..." screen. Set the
      # repository variable X_IN_CLOUD to "false" to leave X to x_home.yml (your own computer). ----
      - name: Setup Node.js (X scraper)
        if: env.X_AUTH_TOKEN != '' && vars.X_IN_CLOUD != 'false' && github.event.inputs.backfill_days == ''
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run X scraper
        if: env.X_AUTH_TOKEN != '' && vars.X_IN_CLOUD != 'false' && github.event.inputs.backfill_days == ''
        continue-on-error: true      # X problems must never block the other sources
        timeout-minutes: 25          # a hung browser must not eat the whole job
        run: |
          python -m monitor.pipeline queries > scraper/queries.json
          cd scraper
          npm ci
          npx playwright install chromium --with-deps
          npm run build
          X_HEADFUL=1 xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" npm start

      # ---- all free sources + analysis + storage ----
      - name: Collect, analyse and store
        if: github.event.inputs.backfill_days == ''
        run: |
          ARGS="--require-db --extra-json scraper/x_items.json"
          if [ -n "${{ github.event.inputs.hours }}" ]; then ARGS="$ARGS --hours ${{ github.event.inputs.hours }}"; fi
          python -m monitor.pipeline run $ARGS

      # ---- one-off history (Actions → Run workflow → backfill_days = 365) ----
      - name: Backfill past days
        if: github.event.inputs.backfill_days != ''
        run: |
          ARGS="--days ${{ github.event.inputs.backfill_days }}"
          if [ -n "${{ github.event.inputs.backfill_until }}" ]; then ARGS="$ARGS --until ${{ github.event.inputs.backfill_until }}"; fi
          python -m monitor.pipeline backfill $ARGS
