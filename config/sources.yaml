# Where the monitor collects from. Every source is free.
# Remove a line to skip a source, or add your own. Unreachable sources are skipped with a warning.

# How far back to collect on each run (hours) and how many results per search query.
lookback_hours: 48
max_per_query: 100

# --- NEWS MEDIA ---------------------------------------------------------------------------
