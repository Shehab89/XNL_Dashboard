# Google News search (covers hundreds of Dutch outlets incl. regional ones). One search per
# party, politician and issue is run automatically; these are extra searches on top of that.
# `feeds` are Google News sections read as a whole (no search).
google_news:
  enabled: true
  feeds: ["https://news.google.com/rss/headlines/section/topic/NATION?hl=nl&gl=NL&ceid=NL:nl",
          "https://news.google.com/rss?hl=nl&gl=NL&ceid=NL:nl"]
  extra_queries: [
    # parliament and government
    "Tweede Kamer", "Eerste Kamer", "kabinet", "minister", "staatssecretaris", "coalitie", "oppositie",
    "Kamerdebat", "Kamervragen", "motie", "amendement", "ministerraad", "premier", "formatie", "informateur",
    "coalitieakkoord", "vertrouwensvotum", "Provinciale Staten", "gemeenteraad", "Haagse politiek",
    "peiling", "verkiezingen", "Prinsjesdag", "Miljoenennota", "Troonrede", "Voorjaarsnota",
    "Algemene Politieke Beschouwingen", "Raad van State", "wetsvoorstel",
    # migration
    "asielzoekerscentrum", "azc", "spreidingswet", "asielbeleid", "migratiedeal", "IND", "statushouders",
    "gezinshereniging", "arbeidsmigratie", "Ter Apel",
    # housing, money, work
    "huurprijzen", "woningnood", "woningbouw", "huurbevriezing", "koopkracht", "inflatie", "energierekening",
    "belastingplan", "box 3", "minimumloon", "pensioenen", "AOW", "bestaanszekerheid", "armoede",
    "toeslagenaffaire", "kinderopvangtoeslag", "huurtoeslag", "bezuinigingen",
    # care, education
    "eigen risico", "zorgpremie", "zorgverzekering", "jeugdzorg", "ouderenzorg", "onderwijs bezuinigingen",
    "studiefinanciering", "leraren tekort",
    # climate, farming, energy
    "stikstof", "boeren", "boerenprotest", "klimaatbeleid", "klimaatdoelen", "kernenergie", "windparken",
    "Groningen gaswinning", "Schiphol krimp",
    # security, foreign policy
    "defensie-uitgaven", "NAVO", "Oekraïne", "Rusland sancties", "Gaza", "Israël", "Europese Unie",
    "Brussel Nederland", "politie", "ondermijning", "discriminatie", "demonstratie Den Haag"]

# GDELT: global news database, free API. Adds outlets that are not in Google News.
# One search per party, politician and issue, plus these broad searches (250 articles each, GDELT's maximum).
gdelt:
  enabled: true
  maxrecords: 250
  extra_queries:
    - 'sourcecountry:netherlands (kabinet OR minister OR "Tweede Kamer" OR coalitie OR oppositie)'
    - 'sourcecountry:netherlands (asiel OR migratie OR stikstof OR huur OR koopkracht OR zorg)'
    - 'sourcecountry:netherlands (verkiezingen OR peiling OR formatie OR premier OR partij)'
    - 'sourcelang:dutch ("Tweede Kamer" OR kabinet OR ministerraad OR Kamerdebat)'
    - 'sourcecountry:belgium sourcelang:dutch (Nederland OR Nederlandse) (kabinet OR verkiezingen OR premier)'

# --- SOCIAL MEDIA -------------------------------------------------------------------------
# Bluesky: searched for every party and issue (Dutch-language posts only).
# Search may require a free Bluesky account: set BSKY_HANDLE and BSKY_APP_PASSWORD
# (Settings -> Privacy and security -> App passwords).
bluesky:
  enabled: true

# Mastodon: public hashtag timelines (paged back to the start of the look-back window, `max_pages` x 40 posts)
# and the whole local timeline of the Dutch servers in `local_timelines` (`local_pages` x 40 posts).
mastodon:
  instances: [mastodon.nl, mastodon.social, social.overheid.nl, toot.community, mastodon.online]
  local_timelines: [mastodon.nl, toot.community]
  max_pages: 5
  local_pages: 25
  hashtags: [tweedekamer, politiek, kabinet, nlpolitiek, verkiezingen, formatie, prinsjesdag, denhaag,
             pvv, vvd, d66, glpvda, groenlinks, pvda, cda, pro, ja21, bbb, fvd, sp, christenunie, cu, sgp, denk,
             pvdd, volt, nsc,
             jetten, wilders, klaver, yesilgoz, bontenbal, timmermans, baudet, vanderplas, eerdmans,
             asiel, migratie, stikstof, wonen, woningnood, klimaat, zorg, onderwijs, koopkracht, toeslagenaffaire,
             defensie, oekraine, gaza]

# Reddit: newest posts in Dutch subreddits + subreddit search per party.
reddit:
  subreddits: [thenetherlands, nederlands, Netherlands, NederlandsePolitiek, ik_ihe, DutchFIRE, Amsterdam,
               rotterdam, utrecht, TheHague, groningen, eindhoven, nijmegen, Leiden]

# Telegram: public channels (read from https://t.me/s/<channel>, no account needed).
# Add the channel names you want to follow (the part after t.me/). A name that does not exist is logged
# ("not found") and skipped; the run log shows how many posts each channel gave.
telegram:
  channels: [ongehoordnederland, fvdemocratie, thierrybaudet, wybrenvanhaga, blckbx, deanderekrant,
             nieuwrechts, viruswaarheid, pvvpers]

# YouTube: channel uploads via RSS (titles + descriptions). Use the channel's @handle (looked up on every run)
# or its channel ID (starts with "UC"). Handles that cannot be found are logged and skipped.
# Optional: with a free YOUTUBE_API_KEY (YouTube Data API v3) the newest top-level comments on the
# `comment_videos` newest videos of this run are collected too (`comment_pages` x 100 comments per video,
# 1 quota unit per page; 10,000 free units a day).
