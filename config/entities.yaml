# What the monitor looks for in every post and article, plus the reference facts the website shows.
#
# parties:  name -> colour, aliases and facts. An item "mentions" a party when any alias appears.
#           Aliases in `exact` are matched case-sensitively as whole words: use it for acronyms
#           and for names that are also normal Dutch words ("DENK", "Klaver", "Dassen", "Volt").
#           Aliases in `words` are matched case-insensitively as whole words / phrases.
#           full_name / seats / leader / coalition are shown on the website; keep them current
#           (source: tweedekamer.nl > Fracties). seats are current fractie sizes, not the election result.
# politicians: name -> party, role and aliases (case-sensitive whole words; use the full name when the
#           surname alone is ambiguous). The database tags every item with the politicians it mentions;
#           changing an alias here re-tags all stored items on the next run.
# issues:   name -> keyword stems. A stem matches at the start of a word
#           ("asiel" matches "asielzoekers"); add "$" to require the whole word ("zorg$").

